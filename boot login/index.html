<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container row m-5">
        <div class="col-6  border border-1 border-secondary rounded-5">
            <h2 class="text-center mb-5 ">Login Form</h2>
            <form>
            <div class="mb-3">
              <label for="exampleInputEmail1" class="form-label">Email address</label>
              <input type="email" class="form-control border border-top-0 border-start-0  border-end-0 rounded-0 " id="exampleInputEmail1" aria-describedby="emailHelp" placeholder=" email">
            </div>
            <div class="mb-3">
              <label for="exampleInputPassword1" class="form-label">Password </label>
              <input type="password" class="form-control  border border-top-0 border-start-0  border-end-0 rounded-0 " id="exampleInputPassword1" placeholder="password">
            </div>
            <div class="mb-3 form-check d-flex justify-content-between">
              <div><input type="checkbox" class="form-check-input" id="exampleCheck1">
                <label class="form-check-label" for="exampleCheck1">Check me out</label></div>
              <a class="text-secondary text-decoration-none" href="">Forgot password?</a>
            </div>
            <div class="text-center">
            <button type="submit" class="btn btn-primary $success-bg-subtle-dark w-50 ">Login</button></div>
          </form>
          <div class="row m-5">
         <div class="col"><hr></div>
         <div class="col"><p>Or Sign up with</p></div>
         <div class="col"><hr></div></div>
        
        <div class="d-flex justify-content-around mt-5">
            <i class="fa-brands fa-facebook text-primary  fs-5 fw-bold" ></i>
            <i class="fa-brands fa-instagram text-success fs-5 fw-bold"></i>
            <i class="fa-brands fa-twitter text-danger fs-5 fw-bold"></i>
            <i class="fa-brands fa-linkedin text-info fs-5 fw-bold"></i>
        </div>
        <div class="text-center m-5"><a class="ms-5" href="">Doesn't have an account? SignUp</a></div>
    </div>
        <div class="col-6">
            <img class="img-fluid" src="https://assets.ccbp.in/frontend/react-js/password-manager-lg-img.png" alt="">
        </div>
    </div>
</body>
</html>
